name: ouqro_wallet
description: Octra Wallet - Flutter client with a native PVAC wallet-core bridge
publish_to: "none"

version: 1.2.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking (Octra explorer)
  http: ^1.2.1

  # Secure storage (keys, wallet)
  flutter_secure_storage: ^9.0.0

  # Crypto / keys
  bip39: ^1.0.6
  cryptography: ^2.7.0
  convert: ^3.1.1
  crypto: ^3.0.3
  ffi: ^2.1.3

  # Ethereum wallet + OCT<->wOCT bridge
  web3dart: ^2.7.3
  bip32: ^2.0.0
  walletconnect_flutter_v2: ^2.4.1

  # UI / Assets
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0

  # (Optional but recommended – safe to add later)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  url_launcher: ^6.2.1

  # In-app dApp browser (Android/macOS). Injects the RFC-O-1 window.octra
  # provider. Linux/Windows have no plugin impl — all calls are Platform-gated.
  # Pinned to 6.0.x: 6.1+ pulls web ^1.0.0 which conflicts with
  # walletconnect_flutter_v2 -> package_info_plus 7 (web <=0.6.0).
  flutter_inappwebview: ">=6.0.0 <6.1.0"

  fl_chart: ^0.69.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
