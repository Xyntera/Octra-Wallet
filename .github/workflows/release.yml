name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/release-version"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0); created on main if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_API: "24"
      ANDROID_NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"

      - name: Build Android OpenSSL
        env:
          ANDROID_HOST_TAG: linux-x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          native/cpp/build_android_openssl.sh

      - name: Build Android native core
        env:
          ANDROID_HOST_TAG: linux-x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          source native/cpp/target/openssl-android/env.sh
          native/cpp/build_android.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          fi

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Remove keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux desktop (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libssl-dev python3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build native PVAC core (portable)
        run: native/cpp/build_linux_release.sh

      - name: Smoke test native core
        run: python3 native/cpp/smoke_test.py native/cpp/target/linux/liboctra_core.so

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Verify bundled native core
        run: test -f build/linux/x64/release/bundle/lib/liboctra_core.so

      - name: Package tar.gz bundle
        run: |
          cd build/linux/x64/release
          mv bundle octra-wallet
          tar -czf octra-wallet-linux-x64.tar.gz octra-wallet

      - name: Build Debian package
        run: |
          PKG_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          BUNDLE="build/linux/x64/release/octra-wallet"
          DEB_ROOT="/tmp/octra-wallet-deb"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/usr/lib/octra-wallet"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          cp -r "$BUNDLE"/. "$DEB_ROOT/usr/lib/octra-wallet/"

          cat > "$DEB_ROOT/usr/bin/octra-wallet" << 'LAUNCHER'
          #!/bin/bash
          exec /usr/lib/octra-wallet/ouqro_wallet "$@"
          LAUNCHER
          chmod +x "$DEB_ROOT/usr/bin/octra-wallet"

          cat > "$DEB_ROOT/usr/share/applications/octra-wallet.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Octra Wallet
          Comment=Privacy-preserving Octra blockchain wallet
          Exec=octra-wallet
          Icon=octra-wallet
          Terminal=false
          Type=Application
          Categories=Finance;Network;
          StartupWMClass=ouqro_wallet
          DESKTOP

          cp assets/icon.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/octra-wallet.png"

          cat > "$DEB_ROOT/DEBIAN/control" << CONTROL
          Package: octra-wallet
          Version: $PKG_VERSION
          Section: finance
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0, libssl3
          Maintainer: Octra Wallet <support@octrawalllet.com>
          Description: Octra Wallet
           Privacy-preserving Octra blockchain wallet with native PVAC core.
           Supports public transfers, encrypted balances, and private stealth sends.
          CONTROL

          dpkg-deb --build --root-owner-group "$DEB_ROOT" \
            build/linux/x64/release/octra-wallet-linux-x64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/linux/x64/release/octra-wallet-linux-x64.tar.gz
            build/linux/x64/release/octra-wallet-linux-x64.deb

  windows:
    name: Windows desktop (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64 + OpenSSL)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl

      - name: Build native PVAC core DLL
        shell: msys2 {0}
        run: ./native/cpp/build_windows_msys2.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Verify bundled native core
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release/octra_core.dll")) {
            Write-Error "octra_core.dll missing from bundle"
            exit 1
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath octra-wallet-windows-x64.zip

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)').Matches[0].Groups[1].Value -replace '\+.*', ''
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          $out = Join-Path $PWD 'Octra-Wallet-Setup.exe'
          if (!(Test-Path "$src\octra_core.dll")) {
            Write-Error "Build output not found at $src"
            exit 1
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" "/DSRCDIR=$src" "/DOUTFILE=$out" windows\installer.nsi
          if (!(Test-Path $out)) {
            Write-Error "Installer was not produced"
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            octra-wallet-windows-x64.zip
            Octra-Wallet-Setup.exe

  macos:
    name: macOS desktop (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build native PVAC core dylib
        run: native/cpp/build_macos.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle native core into app and re-sign
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          mkdir -p "$APP/Contents/Frameworks"
          cp native/cpp/target/macos/liboctra_core.dylib "$APP/Contents/Frameworks/"
          codesign --force --sign - "$APP/Contents/Frameworks/liboctra_core.dylib"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"

      - name: Package portable zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app octra-wallet-macos-arm64.zip

      - name: Build DMG
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          mkdir -p /tmp/dmg-staging
          cp -r "$APP" /tmp/dmg-staging/
          ln -s /Applications /tmp/dmg-staging/Applications
          hdiutil create \
            -volname "Octra Wallet" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDZO \
            build/macos/Build/Products/Release/octra-wallet-macos-arm64.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build/macos/Build/Products/Release/octra-wallet-macos-arm64.zip
            build/macos/Build/Products/Release/octra-wallet-macos-arm64.dmg

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [android, linux, windows, macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(tr -d '[:space:]' < .github/release-version)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Invalid release tag: '$TAG'" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Stage versioned assets and checksums
        run: |
          TAG="$RELEASE_TAG"
          mkdir -p dist

          # Android
          cp artifacts/release-android/app-release.apk \
            "dist/Octra-Wallet-$TAG-android.apk"

          # Linux
          cp artifacts/release-linux/octra-wallet-linux-x64.tar.gz \
            "dist/Octra-Wallet-$TAG-linux-x64.tar.gz"
          cp artifacts/release-linux/octra-wallet-linux-x64.deb \
            "dist/Octra-Wallet-$TAG-linux-x64.deb"

          # Windows
          cp artifacts/release-windows/octra-wallet-windows-x64.zip \
            "dist/Octra-Wallet-$TAG-windows-x64.zip"
          cp artifacts/release-windows/Octra-Wallet-Setup.exe \
            "dist/Octra-Wallet-$TAG-windows-x64-Setup.exe"

          # macOS
          cp artifacts/release-macos/octra-wallet-macos-arm64.zip \
            "dist/Octra-Wallet-$TAG-macos-arm64.zip"
          cp artifacts/release-macos/octra-wallet-macos-arm64.dmg \
            "dist/Octra-Wallet-$TAG-macos-arm64.dmg"

          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release notes
        run: |
          NOTES="docs/release-notes-$RELEASE_TAG.md"
          if [ -f "$NOTES" ]; then
            echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
          else
            echo "No $NOTES found; release will use auto-generated notes."
            echo "NOTES_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          name: Octra Wallet ${{ env.RELEASE_TAG }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: ${{ env.NOTES_PATH == '' }}
          files: dist/*
