# Regenerate with: dart run flutter_launcher_icons
# Single source of truth for app icons on every platform.
# Source lives in branding/ (outside assets/) so the master PNG is not
# bundled into the app at runtime.
flutter_launcher_icons:
  image_path: "branding/icon_master.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#03057c"
  adaptive_icon_foreground: "branding/icon_master.png"
  remove_alpha_ios: true
  ios: false
  web:
    generate: true
    image_path: "branding/icon_master.png"
    background_color: "#03057c"
    theme_color: "#03057c"
  windows:
    generate: true
    image_path: "branding/icon_master.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "branding/icon_master.png"
