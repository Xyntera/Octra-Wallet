name: Build & Release Octra Wallet

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctraWallet-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create Windows ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OctraWallet-Windows.zip
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctraWallet-Windows
          path: OctraWallet-Windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: OctraWallet-Android
          path: ./release
      
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: OctraWallet-Windows
          path: ./release
      
      - name: Get Version
        id: version
        run: echo "version=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
      
      - name: Rename APK
        run: mv ./release/app-release.apk ./release/OctraWallet-${{ steps.version.outputs.version }}.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Octra Wallet v${{ steps.version.outputs.version }}
          body: |
            ## 🦉 Octra Wallet Release
            
            **Build Date:** ${{ steps.version.outputs.version }}
            
            ### Downloads
            - **Android APK**: `OctraWallet-${{ steps.version.outputs.version }}.apk`
            - **Windows**: `OctraWallet-Windows.zip`
            
            ### Features
            - Animated Owl Logo
            - Multi-wallet support
            - Encrypted/Private transactions
            - Security PIN & Biometrics
          draft: false
          prerelease: false
          files: |
            ./release/OctraWallet-${{ steps.version.outputs.version }}.apk
            ./release/OctraWallet-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
